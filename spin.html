<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        #canvas { display: block; }
        #hud {
            position: fixed; bottom: 18px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 13px; letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.55);
            text-transform: uppercase; pointer-events: none; white-space: nowrap;
        }
        #prompt {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 17px; letter-spacing: 0.55em;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase; pointer-events: none;
            text-align: center; line-height: 2.4;
            transition: opacity 0.7s;
        }
        #prompt span { font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 0.35em; }
        #portal-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0; z-index: 20;
            background: radial-gradient(ellipse at center, rgba(180,80,255,0.9) 0%, rgba(0,200,255,0.7) 50%, rgba(0,0,0,0) 100%);
            transition: opacity 0.06s;
        }
        #auth-msg {
            position: fixed; top: 30%; left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 17px; letter-spacing: 0.48em;
            color: #00ff88; text-transform: uppercase;
            text-shadow: 0 0 14px rgba(0,255,136,0.9), 0 0 28px rgba(0,255,136,0.4);
            pointer-events: none; opacity: 0; white-space: nowrap;
            transition: opacity 0.28s; z-index: 30;
        }
        #narr-msg {
            position: fixed; bottom: 20%; left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 13px; letter-spacing: 0.58em;
            color: rgba(205,178,255,0.92); text-transform: lowercase;
            text-shadow: 0 0 10px rgba(180,130,255,0.65);
            pointer-events: none; opacity: 0; white-space: nowrap;
            transition: opacity 0.55s; z-index: 30;
        }
        #ascend-msg {
            position: fixed; top: 44%; left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 17px; color: #ffffff;
            text-align: center; line-height: 2.1;
            text-shadow: 0 0 22px rgba(255,255,255,0.98), 0 0 45px rgba(200,220,255,0.5);
            pointer-events: none; opacity: 0;
            transition: opacity 1.3s; z-index: 40;
        }
        #fade-cover {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; pointer-events: none; opacity: 0;
            z-index: 50; transition: opacity 1.8s;
        }
        #aura-indicator {
            position: fixed; top: 14px; right: 22px;
            font-family: 'Courier New', monospace;
            font-size: 12px; letter-spacing: 0.44em;
            color: rgba(180,255,220,0); text-transform: uppercase;
            pointer-events: none; z-index: 25;
        }
        #aura-msg {
            position: fixed; top: 24%; left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 14px; letter-spacing: 0.52em;
            color: rgba(200,255,230,0.95); text-transform: lowercase;
            text-shadow: 0 0 12px rgba(150,255,210,0.75);
            pointer-events: none; opacity: 0; white-space: nowrap;
            transition: opacity 0.85s; z-index: 30;
        }
        #canvas { will-change: filter; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">W · A · S · D · follow the path · Press F for x-ray</div>
<div id="portal-flash"></div>
<div id="prompt">click to begin<br><span>follow the signs · space to jump · F to see</span></div>
<div id="auth-msg"></div>
<div id="narr-msg"></div>
<div id="ascend-msg"></div>
<div id="fade-cover"></div>
<div id="aura-indicator"></div>
<div id="aura-msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════
// SPIN — neon afterlife — follow the path
// ═══════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000814);
scene.fog = new THREE.FogExp2(0x08001a, 0.013);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 350);
camera.position.set(0, 1.7, 0);

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('canvas'),
    antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const clock = new THREE.Clock();
let elapsed = 0;

// ── INPUT ──────────────────────────────────────────
const keys = {};
let locked = false, yaw = 0, pitch = 0;
const camPos = new THREE.Vector3(0, 1.7, 0);
const moveEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const fwd = new THREE.Vector3();
const right = new THREE.Vector3();

document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; });
document.addEventListener('click', () => { if (!locked) document.body.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
    locked = !!document.pointerLockElement;
    document.getElementById('prompt').style.opacity = locked ? '0' : '1';
});
document.addEventListener('mousemove', e => {
    if (!locked) return;
    yaw   -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch  = Math.max(-1.1, Math.min(1.1, pitch));
});

// ── LIGHTS ─────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x18063a, 3.5));
[
    [0xff6600, 80,  [  0, 12,   0]],
    [0xff00aa, 55,  [ 60, 12, -45]],
    [0x00ccff, 55,  [-65, 12,  35]],
    [0xffcc00, 45,  [ 30, 12,  85]],
    [0x9900ff, 45,  [-45, 12, -85]],
    [0x00ff88, 40,  [ 90, 12,  15]],
].forEach(([c, r, p]) => {
    const l = new THREE.PointLight(c, 2.2, r);
    l.position.set(...p);
    scene.add(l);
});

// ── GLOW TEXTURE ───────────────────────────────────
const glowTex = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.3, 'rgba(255,255,255,0.5)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(32, 32, 32, 0, Math.PI * 2); ctx.fill();
    return new THREE.CanvasTexture(c);
})();

function makeSymTex(sym, color, size) {
    size = size || 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const hex = '#' + color.toString(16).padStart(6, '0');
    ctx.shadowColor = hex;
    ctx.shadowBlur = size * 0.3;
    ctx.fillStyle = hex;
    ctx.font = 'bold ' + (size * 0.62) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sym, size / 2, size / 2);
    ctx.globalAlpha = 0.35;
    ctx.font = 'bold ' + (size * 0.7) + 'px Arial';
    ctx.fillText(sym, size / 2, size / 2);
    ctx.globalAlpha = 1;
    return new THREE.CanvasTexture(c);
}

// ── GROUND ─────────────────────────────────────────
(function() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#03010a';
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = 'rgba(55, 0, 90, 0.13)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 32; i++) {
        const p = i * 16;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(512, p); ctx.stroke();
    }
    for (let i = 0; i < 110; i++) {
        const x = Math.random() * 512, y = Math.random() * 512;
        ctx.beginPath(); ctx.arc(x, y, 1 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,' + (80 + Math.random() * 100 | 0) + ',0,0.07)';
        ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(24, 24);
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(450, 450),
        new THREE.MeshBasicMaterial({ map: tex })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
}());

// ── STARS ──────────────────────────────────────────
(function() {
    const pos = [];
    for (let i = 0; i < 2000; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(Math.random() * 2 - 1);
        const r = 200 + Math.random() * 80;
        pos.push(
            r * Math.sin(phi) * Math.cos(theta),
            Math.abs(r * Math.cos(phi)) + 10,
            r * Math.sin(phi) * Math.sin(theta)
        );
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffffff, size: 0.55, transparent: true, opacity: 0.5
    })));
}());

// ── NEON PALETTE ───────────────────────────────────
const NEON = [0xff6600, 0xff00aa, 0x00ccff, 0xffcc00, 0x9900ff, 0x00ff88, 0xff3366, 0x33bbff];

var buildings  = [];   // active buildings for collision
var glitching  = [];   // { group, t, ox, oz } currently dissolving

// ── BUILDINGS ──────────────────────────────────────
function makeBuilding(x, z, w, h, d, color) {
    const g = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshBasicMaterial({ color: 0x04010d })
    );
    body.position.y = h / 2;
    g.add(body);

    const wire = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.18, h + 0.18, d + 0.18),
        new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.22 })
    );
    wire.position.y = h / 2;
    g.add(wire);

    for (let y = 2; y < h; y += 2.5 + Math.random() * 3.5) {
        if (Math.random() < 0.28) continue;
        const band = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.22, 0.1, d + 0.22),
            new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 })
        );
        band.position.y = y;
        g.add(band);
    }

    const beacon = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, color, transparent: true, opacity: 0.4,
        blending: THREE.AdditiveBlending, depthWrite: false
    }));
    beacon.position.y = h + 1.5;
    beacon.scale.setScalar(5 + Math.random() * 5);
    g.add(beacon);

    if (h > 16 && Math.random() > 0.4) {
        const tw = w * (0.5 + Math.random() * 0.3);
        const td = d * (0.5 + Math.random() * 0.3);
        const th = 4 + Math.random() * 10;
        const tb = new THREE.Mesh(
            new THREE.BoxGeometry(tw, th, td),
            new THREE.MeshBasicMaterial({ color: 0x04010d })
        );
        tb.position.y = h + th / 2;
        g.add(tb);
        const tw2 = new THREE.Mesh(
            new THREE.BoxGeometry(tw + 0.12, th + 0.12, td + 0.12),
            new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.3 })
        );
        tw2.position.y = h + th / 2;
        g.add(tw2);
    }

    g.position.set(x, 0, z);
    g.userData.bw = w;
    g.userData.bd = d;
    scene.add(g);
    buildings.push(g);
    return g;
}

for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 35 + Math.random() * 100;
    const c = NEON[Math.floor(Math.random() * NEON.length)];
    makeBuilding(
        Math.cos(a) * d, Math.sin(a) * d,
        3 + Math.random() * 7, 8 + Math.random() * 35, 3 + Math.random() * 7, c
    );
}
[[-14,-18],[16,6],[-10,22],[22,-12],[-20,12],[8,-25],[25,20]].forEach(function(pos, i) {
    makeBuilding(pos[0], pos[1],
        4 + Math.random() * 4, 15 + Math.random() * 25, 4 + Math.random() * 4,
        NEON[i % NEON.length]);
});

// ── NEON TREES ─────────────────────────────────────
function makeTree(x, z, color) {
    const g = new THREE.Group();
    const trunkH = 3 + Math.random() * 3;
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.28, trunkH, 7),
        new THREE.MeshBasicMaterial({ color: 0x150028 })
    );
    trunk.position.y = trunkH / 2;
    g.add(trunk);

    const layers = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < layers; i++) {
        const r = 1.8 + Math.random() * 2 - i * 0.35;
        const canopy = new THREE.Mesh(
            new THREE.SphereGeometry(r, 8, 6),
            new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.65 + Math.random() * 0.2 })
        );
        canopy.position.y = trunkH + 0.5 + i * 1.8 + Math.random() * 0.5;
        g.add(canopy);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTex, color, transparent: true, opacity: 0.22,
            blending: THREE.AdditiveBlending, depthWrite: false
        }));
        halo.position.y = canopy.position.y;
        halo.scale.setScalar((r + 1.5) * 2.8);
        g.add(halo);
    }
    g.position.set(x, 0, z);
    scene.add(g);
}

for (let i = 0; i < 45; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 12 + Math.random() * 85;
    makeTree(Math.cos(a) * d, Math.sin(a) * d, NEON[Math.floor(Math.random() * NEON.length)]);
}

// ── PORTAL RINGS ───────────────────────────────────
const spinners = [];
for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + Math.random() * 0.5;
    const d = 18 + Math.random() * 65;
    const color = NEON[i % NEON.length];
    const radius = 3.5 + Math.random() * 3;

    // Group so inner disc inherits torus rotation
    const pg = new THREE.Group();

    const torus = new THREE.Mesh(
        new THREE.TorusGeometry(radius, 0.22, 12, 60),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
    );
    pg.add(torus);

    // Inner portal disc — semi-transparent, additive
    const disc = new THREE.Mesh(
        new THREE.CircleGeometry(radius - 0.1, 48),
        new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.12,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );
    pg.add(disc);

    // Reachable heights: 3–7 units so a jump can thread them
    pg.position.set(Math.cos(a) * d, 3.5 + Math.random() * 3.5, Math.sin(a) * d);
    pg.rotation.x = Math.random() * Math.PI;
    pg.rotation.z = Math.random() * Math.PI;
    pg.userData = {
        rs: {
            x: (Math.random() - 0.5) * 0.7,
            y: (Math.random() - 0.5) * 0.5,
            z: (Math.random() - 0.5) * 0.6
        },
        radius,
        color,
        torusMat: torus.material,
        discMat: disc.material,
        baseOpacity: 0.9
    };
    scene.add(pg);
    spinners.push(pg);

    // Ambient glow halo at ring position
    const rg = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, color, transparent: true, opacity: 0.18,
        blending: THREE.AdditiveBlending, depthWrite: false
    }));
    rg.position.copy(pg.position);
    rg.scale.setScalar(radius * 4);
    scene.add(rg);
}

// ── NEON ARCHES ────────────────────────────────────
for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const d = 20 + Math.random() * 45;
    const color = NEON[(i + 2) % NEON.length];
    const width = 6 + Math.random() * 6;
    const height = 10 + Math.random() * 8;
    const g = new THREE.Group();

    [-width / 2, width / 2].forEach(function(px) {
        const p = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.28, height, 8),
            new THREE.MeshBasicMaterial({ color: 0x050110 })
        );
        p.position.set(px, height / 2, 0);
        g.add(p);
        const pw = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.31, height + 0.1, 8),
            new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.35 })
        );
        pw.position.set(px, height / 2, 0);
        g.add(pw);
    });

    const arch = new THREE.Mesh(
        new THREE.TorusGeometry(width / 2, 0.2, 8, 32, Math.PI),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })
    );
    arch.position.y = height;
    arch.rotation.z = Math.PI;
    g.add(arch);

    g.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    g.rotation.y = Math.random() * Math.PI * 2;
    scene.add(g);
}

// ── FLOATING NEON SIGNS ────────────────────────────
var signTexts = ['◈  ◈  ◈', '⬡  ✦  ⬡', '⟐  ⊕  ⟐', '∞  ∞  ∞', '◆ ◇ ◆',
    'null → void', 'follow . follow', '⬟ ⬢ ⬟ ⬢', 'lost here', '◉ ⊗ ◉',
    'this way →', '← that way', 'still here', 'where?', '???  ???'];
var floatSigns = [];
for (var si = 0; si < 24; si++) {
    var sa = Math.random() * Math.PI * 2;
    var sd = 18 + Math.random() * 85;
    var sc = NEON[Math.floor(Math.random() * NEON.length)];
    var shex = '#' + sc.toString(16).padStart(6, '0');
    var sCanvas = document.createElement('canvas');
    sCanvas.width = 256; sCanvas.height = 56;
    var sCtx = sCanvas.getContext('2d');
    sCtx.shadowColor = shex; sCtx.shadowBlur = 18;
    sCtx.fillStyle = shex;
    sCtx.font = 'bold 20px Courier New, monospace';
    sCtx.textAlign = 'center'; sCtx.textBaseline = 'middle';
    sCtx.fillText(signTexts[si % signTexts.length], 128, 28);
    var fsSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(sCanvas), transparent: true, opacity: 0.7
    }));
    fsSprite.position.set(Math.cos(sa) * sd, 6 + Math.random() * 14, Math.sin(sa) * sd);
    fsSprite.scale.set(8, 2.2, 1);
    fsSprite.userData = {
        baseY: fsSprite.position.y,
        speed: 0.25 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2
    };
    scene.add(fsSprite);
    floatSigns.push(fsSprite);
}

// ── SOCK ───────────────────────────────────────────
(function() {
    var tc = document.createElement('canvas');
    tc.width = tc.height = 256;
    var tctx = tc.getContext('2d');
    tctx.fillStyle = '#f4f2ef';
    tctx.fillRect(0, 0, 256, 256);
    // Tiny sock silhouette pattern
    tctx.fillStyle = '#b0ac9e';
    for (var sr = 0; sr < 7; sr++) {
        for (var sc = 0; sc < 6; sc++) {
            var mx = sc * 38 + (sr % 2) * 19 + 4;
            var my = sr * 34 + 4;
            tctx.fillRect(mx + 4, my, 8, 14);         // leg
            tctx.fillRect(mx, my + 10, 19, 7);        // foot
            tctx.beginPath();
            tctx.arc(mx + 19, my + 13, 5, -Math.PI / 2, Math.PI / 2);
            tctx.fill();                               // toe
        }
    }
    var sockTex = new THREE.CanvasTexture(tc);
    var smat = new THREE.MeshBasicMaterial({ map: sockTex, side: THREE.DoubleSide });

    var sg = new THREE.Group();

    var cuffM = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.31, 0.22, 14), smat);
    cuffM.position.y = 1.15;
    sg.add(cuffM);

    var legM = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.28, 0.82, 12), smat);
    legM.position.y = 0.70;
    sg.add(legM);

    var heelM = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), smat);
    heelM.position.set(0, 0.26, 0.08);
    heelM.scale.set(0.95, 0.85, 1.2);
    sg.add(heelM);

    var footM = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.25, 0.68, 10), smat);
    footM.rotation.x = Math.PI / 2;
    footM.position.set(0, 0.17, 0.44);
    sg.add(footM);

    var toeM = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6), smat);
    toeM.position.set(0, 0.17, 0.80);
    sg.add(toeM);

    // tip it over so it lies on the ground casually
    sg.rotation.z = Math.PI / 2 + 0.12;
    sg.rotation.y = 1.2;
    sg.position.set(18, 0.30, 12);
    scene.add(sg);
}());

// ── OFFICE DRAWER ──────────────────────────────────
(function() {
    var og = new THREE.Group();
    var cabinetMat = new THREE.MeshBasicMaterial({ color: 0x8a8880 });
    var darkMat    = new THREE.MeshBasicMaterial({ color: 0x6a6860 });

    var bodyM = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.72), cabinetMat);
    bodyM.position.y = 0.7;
    og.add(bodyM);

    // wrecked dent (wireframe patch)
    var dentM = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.32, 0.08),
        new THREE.MeshBasicMaterial({ color: 0x444440, wireframe: true }));
    dentM.position.set(0.36, 1.0, -0.36);
    og.add(dentM);

    // drawer slot surround
    var slotM = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.36, 0.06), darkMat);
    slotM.position.set(0, 0.75, 0.36);
    og.add(slotM);

    // open drawer body (pulled out)
    var drawerM = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.30, 0.62), darkMat);
    drawerM.position.set(0, 0.76, 0.74);
    og.add(drawerM);

    // drawer front face
    var dfaceM = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.38, 0.06), cabinetMat);
    dfaceM.position.set(0, 0.76, 1.06);

function genPath(n) {
    var pts = [new THREE.Vector3(0, 0.45, 8)];
    var angle = 0;
    for (var i = 1; i < n; i++) {
        angle += (Math.random() - 0.5) * 2.2;
        var last = pts[i - 1];
        var dist = Math.sqrt(last.x * last.x + last.z * last.z);
        if (dist > 105) {
            angle = Math.atan2(-last.x, -last.z) + (Math.random() - 0.5) * 1.2;
        }
        var step = 5 + Math.random() * 10;
        pts.push(new THREE.Vector3(
            last.x + Math.sin(angle) * step,
            0.45,
            last.z + Math.cos(angle) * step
        ));
    }
    return pts;
}

// ── JUMP + PORTAL STATE ────────────────────────────
var velY = 0;
var onGround = true;
var portalCooldown = 0;
var portalFlashEl = document.getElementById('portal-flash');

function checkPortals(dt) {
    portalCooldown = Math.max(0, portalCooldown - dt);

    for (var i = 0; i < spinners.length; i++) {
        var sp = spinners[i];
        var r  = sp.userData.radius;
        var dx = camPos.x - sp.position.x;
        var dy = camPos.y - sp.position.y;
        var dz = camPos.z - sp.position.z;
        var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        var near = dist < r + 5;

        // Proximity glow — disc brightens, ring pulses
        sp.userData.torusMat.opacity = near
            ? 0.95 + 0.05 * Math.sin(elapsed * 8)
            : sp.userData.baseOpacity;
        sp.userData.discMat.opacity = near
            ? 0.25 + 0.15 * Math.sin(elapsed * 6)
            : 0.12;

        // Portal trigger — player centre inside the ring volume
        if (portalCooldown <= 0 && dist < r * 0.85) {
            // pick a random different portal
            var dest = i;
            while (spinners.length > 1 && dest === i) {
                dest = Math.floor(Math.random() * spinners.length);
            }
            var target = spinners[dest];

            // place player just in front of the destination ring
            var exitDir = new THREE.Vector3(0, 0, -1).applyEuler(
                new THREE.Euler(target.rotation.x, target.rotation.y, target.rotation.z, 'XYZ')
            );
            camPos.set(
                target.position.x + exitDir.x * (target.userData.radius + 1.5),
                Math.max(1.7, target.position.y),
                target.position.z + exitDir.z * (target.userData.radius + 1.5)
            );
            velY = 1.5;
            onGround = false;

            // screen flash
            portalFlashEl.style.transition = 'opacity 0.06s';
            portalFlashEl.style.opacity = '1';
            setTimeout(function() {
                portalFlashEl.style.transition = 'opacity 0.5s';
                portalFlashEl.style.opacity = '0';
            }, 90);

            onPortalTravel();
            portalCooldown = 1.8;
            break;
        }
    }
}

// ── FEDORA UPDATE ──────────────────────────────────
function updateFedora(dt) {
    if (fedoraState === 'waiting') {
        if (elapsed > 15) {
            fedoraState = 'flying';
            fedoraT = 0;
            fedoraSpawnYaw = yaw;
            fedoraSpawnPos.copy(camPos);
            fedora.visible = true;
        }
        return;
    }
    if (fedoraState === 'gone') return;

    fedoraT += dt / 5.5;
    if (fedoraT >= 1) {
        fedoraState = 'gone';
        fedora.visible = false;
        return;
    }

    var t = fedoraT;
    // forward / right unit vectors from spawn yaw
    var fwX =  Math.sin(fedoraSpawnYaw);
    var fwZ = -Math.cos(fedoraSpawnYaw);
    var rtX =  Math.cos(fedoraSpawnYaw);
    var rtZ =  Math.sin(fedoraSpawnYaw);

    // sweep left → right across FOV; arc closest at t=0.5
    var side = (t - 0.5) * 9;
    var fwd2 = 3.5 + Math.sin(t * Math.PI) * 1.8;
    var ht   = fedoraSpawnPos.y + 1.6 + Math.sin(t * Math.PI) * 2.0;

    fedora.position.set(
        fedoraSpawnPos.x + fwX * fwd2 + rtX * side,
        ht,
        fedoraSpawnPos.z + fwZ * fwd2 + rtZ * side
    );
    fedora.rotation.y += dt * 2.8;
    fedora.rotation.z = Math.sin(t * Math.PI * 4) * 0.28;

    // orbit sparkles
    for (var ci = 0; ci < fedora.children.length; ci++) {
        var ch = fedora.children[ci];
        if (ch.userData.sparkAngle === undefined) continue;
        ch.userData.sparkAngle += dt * 3.2;
        var sa3 = ch.userData.sparkAngle;
        ch.position.set(Math.cos(sa3) * 0.95, 0.3 + Math.sin(sa3 * 2) * 0.14, Math.sin(sa3) * 0.95);
    }
}

// ── RAINBOW FLICKER UPDATE ─────────────────────────
function updateRainbowFlicker(dt) {
    if (rainbowExtinguished) return;

    var dx2  = camPos.x - RAINBOW_POS.x;
    var dz2  = camPos.z - RAINBOW_POS.z;
    var dist2 = Math.sqrt(dx2 * dx2 + dz2 * dz2);

    // reached the building — kill all lights permanently
    if (dist2 < 9) {
        for (var ki = 0; ki < rainbowLightMeshes.length; ki++) {
            var km = rainbowLightMeshes[ki];
            if (km.material) { km.material.opacity = 0; km.material.transparent = true; }
        }
        rainbowExtinguished = true;
        return;
    }

    // flicker rate grows as player gets closer
    var flickerHz = 0;
    if      (dist2 < 18)  flickerHz = 20;
    else if (dist2 < 30)  flickerHz = 8;
    else if (dist2 < 45)  flickerHz = 2.5;
    else if (dist2 < 60)  flickerHz = 0.7;

    if (flickerHz > 0) {
        rfTimer -= dt;
        if (rfTimer <= 0) {
            rfState  = !rfState;
            rfTimer  = rfState
                ? 0.04 + Math.random() * (1 / flickerHz)
                : 0.025 + Math.random() * 0.06;
        }
    } else {
        rfState = true;
    }

    for (var ri = 0; ri < rainbowLightMeshes.length; ri++) {
        var rm = rainbowLightMeshes[ri];
        if (!rm.material) continue;
        if (!rm.material.transparent) rm.material.transparent = true;
        rm.material.opacity = rfState ? (rm.userData.baseOpacity || 0.5) : 0;
    }
}

function checkBuildingCollisions() {
    for (var i = buildings.length - 1; i >= 0; i--) {
        var b = buildings[i];
        var hw = b.userData.bw / 2 + 1.2;
        var hd = b.userData.bd / 2 + 1.2;
        if (camPos.x > b.position.x - hw && camPos.x < b.position.x + hw &&
            camPos.z > b.position.z - hd && camPos.z < b.position.z + hd) {
            glitching.push({ group: b, t: 0, ox: b.position.x, oz: b.position.z });
            buildings.splice(i, 1);
        }
    }
}

function updateGlitching(dt) {
    for (var i = glitching.length - 1; i >= 0; i--) {
        var g = glitching[i];
        g.t += dt;
        var grp = g.group;
        var prog = g.t / 1.3;

        if (g.t < 1.3) {
            // position jitter — violent early, calms as it fades
            if (Math.random() < 0.65) {
                var jAmt = (1 - prog) * 1.4 + 0.15;
                grp.position.x = g.ox + (Math.random() - 0.5) * jAmt;
                grp.position.z = g.oz + (Math.random() - 0.5) * jAmt;
            }

            // scale pulse
            grp.scale.setScalar(1 + (Math.random() - 0.5) * 0.12 * (1 - prog));

            // per-child flicker + fade
            for (var c = 0; c < grp.children.length; c++) {
                var child = grp.children[c];
                if (!child.material) continue;
                var mat = child.material;

                // color flash (white / red / original)
                if (mat.color && Math.random() < 0.45) {
                    var r = Math.random();
                    if      (r < 0.35) mat.color.setHex(0xffffff);
                    else if (r < 0.6)  mat.color.setHex(0xff0033);
                    else if (r < 0.75) mat.color.setHex(0x00ffff);
                    // else leave colour alone for a frame
                }

                // visibility strobe only in first half
                if (g.t < 0.55) {
                    child.visible = Math.random() > 0.18;
                } else {
                    child.visible = true;
                }

                // opacity collapse in second half
                if (g.t > 0.45) {
                    var fade = 1 - (g.t - 0.45) / 0.85;
                    fade = Math.max(0, fade + (Math.random() - 0.5) * 0.2);
                    if (mat.opacity !== undefined) mat.opacity = fade;
                    if (!mat.transparent) mat.transparent = true;
                }
            }
        } else {
            scene.remove(grp);
            glitching.splice(i, 1);
        }
    }
}

function updateStaircase(dt) {
    if (!staircaseGroup) return;
    stairTimer += dt;
    var ascendEl = document.getElementById('ascend-msg');
    var fadeEl   = document.getElementById('fade-cover');

    // ─ RISING: staircase emerges from underground ─
    if (stairPhase === 'rising') {
        var prog = Math.min(1, stairTimer / 2.8);
        var ease = prog * prog * (3 - 2 * prog);
        staircaseGroup.position.y = (stairBaseY - 22) + ease * 22;
        if (Math.random() < 0.10) {
            staircaseGroup.position.x += (Math.random()-0.5) * 0.4;
            staircaseGroup.position.z += (Math.random()-0.5) * 0.4;
        }
        for (var ri = 0; ri < staircaseGroup.children.length; ri++) {
            var rc = staircaseGroup.children[ri];
            if (!rc.material) continue;
            var delay = (rc.userData.si || 0) / 30;
            var stepEase = Math.max(0, Math.min(1, (prog - delay * 0.6) / 0.5));
            rc.material.opacity = stepEase * (rc.userData.si !== undefined ? (0.3 + 0.25 * Math.sin(elapsed * 6 + (rc.userData.si||0))) : 0.92);
        }
        if (prog >= 1) {
            stairPhase = 'waiting';
            stairTimer = 0;
            showNarr('something is rising');
        }
        return;
    }

    // ─ WAITING: pulse, check for player entering zone ─
    if (stairPhase === 'waiting') {
        var ry2  = staircaseGroup.rotation.y;
        var relX = camPos.x - staircaseGroup.position.x;
        var relZ = camPos.z - staircaseGroup.position.z;
        var lx2  =  relX * Math.cos(ry2) + relZ * Math.sin(ry2);
        var lz2  = -relX * Math.sin(ry2) + relZ * Math.cos(ry2);
        var inZone = Math.abs(lx2) < 3.8 && lz2 < 2 && lz2 > -28;
        for (var pi2 = 0; pi2 < staircaseGroup.children.length; pi2++) {
            var pc = staircaseGroup.children[pi2];
            if (pc.userData.si !== undefined && pc.material) {
                pc.material.opacity = 0.3 + 0.22 * Math.sin(elapsed * 3.5 + (pc.userData.si||0) * 0.5);
            } else if (pc.material && pc.material.wireframe === undefined) {
                pc.material.opacity = 0.88 + 0.08 * Math.sin(elapsed * 2);
            }
        }
        if (inZone) {
            stairPhase = 'ascending';
            stairTimer = 0;
            stairAscendTimer = 0;
            stairGlitchTimer = 0;
        }
        return;
    }

    // ─ ASCENDING: glitch player upward ─
    if (stairPhase === 'ascending') {
        stairAscendTimer += dt;
        var ascProg = Math.min(1, stairAscendTimer / 6.5);
        var targetY = stairBaseY + 1.7 + ascProg * 19;
        camPos.y += (targetY - camPos.y) * Math.min(1, dt * 4.0);
        velY = 0; onGround = true;

        stairGlitchTimer -= dt;
        if (stairGlitchTimer <= 0) {
            var gi = 1 + ascProg * 3.5;
            jitterX2 = (Math.random()-0.5) * 0.09 * gi;
            jitterY2 = (Math.random()-0.5) * 0.09 * gi;
            jitterActive = 0.18;
            camPos.y += Math.random() * 0.9 * gi;
            portalFlashEl.style.transition = 'opacity 0.03s';
            portalFlashEl.style.opacity = (0.12 + Math.random() * 0.35 * gi).toFixed(2);
            setTimeout(function() { portalFlashEl.style.transition = 'opacity 0.3s'; portalFlashEl.style.opacity = '0'; }, 55);
            stairGlitchTimer = Math.max(0.06, 0.38 - ascProg * 0.25);
        }
        for (var ai = 0; ai < staircaseGroup.children.length; ai++) {
            var ac = staircaseGroup.children[ai];
            if (!ac.material) continue;
            if (ac.userData.si !== undefined) {
                ac.material.opacity = Math.random() < 0.07 ? 0.98 : (0.42 + 0.32 * Math.sin(elapsed * 10 + (ac.userData.si||0)));
            } else {
                ac.material.opacity = Math.random() < 0.05 ? 1.0 : 0.9;
            }
        }
        if (ascProg >= 1) {
            camPos.y = stairBaseY + 20.5;
            velY = 0; onGround = true;
            stairPhase = 'top';
            stairTimer = 0;
            spawnClouds();
        }
        return;
    }

    // ─ TOP: fade in clouds, emoji, text ─
    if (stairPhase === 'top') {
        if (stairClouds) {
            for (var cfi = 0; cfi < stairClouds.children.length; cfi++) {
                var cfc = stairClouds.children[cfi];
                if (cfc.material) {
                    var cft = cfc.userData.tOp || 0.5;
                    cfc.material.opacity = Math.min(cft, cfc.material.opacity + dt * 0.5);
                }
            }
        }
        if (stairEmoji) {
            var efx = Math.sin(yaw), efz = -Math.cos(yaw);
            stairEmoji.position.set(camPos.x + efx * 3.8, camPos.y + 0.4, camPos.z + efz * 3.8);
            stairEmoji.material.opacity = Math.min(1, stairTimer * 1.2);
        }
        if (stairTimer > 2.0 && stairTimer < 2.1) {
            ascendEl.innerHTML = 'omg its so nice to connect with u again!<br>finally, we can ascend together!';
            ascendEl.style.opacity = '1';
        }
        if (stairTimer > 6.0) {
            ascendEl.style.opacity = '0';
            stairPhase = 'fly';
            stairTimer = 0;
        }
        return;
    }

    // ─ FLY: player launches forward then falls ─
    if (stairPhase === 'fly') {
        if (stairTimer < 0.04) {
            var lfx = Math.sin(yaw), lfz = -Math.cos(yaw);
            camPos.x += lfx * 3.5;
            camPos.z += lfz * 3.5;
            velY = 9.5;
            onGround = false;
        }
        if (stairTimer > 2.4) {
            stairPhase = 'fade';
            stairTimer = 0;
            fadeEl.style.transition = 'opacity 1.8s';
            fadeEl.style.opacity = '1';
        }
        return;
    }

    // ─ FADE: transition to gears.html ─
    if (stairPhase === 'fade' && stairTimer > 2.1) {
        window.location.href = 'gears.html';
    }
}

    auraMsgTimeout = setTimeout(function() { auraMsgEl2.style.opacity = '0'; }, 4800);
}

// ── Aura sprites (soft field blobs) ───────────────
var auraSprites = [];
function makeAuraSprite(x, y, z, r, col) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, color: col, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false
    }));
    sp.position.set(x, y, z);
    sp.scale.setScalar(r * 2.2);
    sp.userData = { r: r, ph: Math.random() * Math.PI * 2, spd: 0.3 + Math.random() * 0.7 };
    scene.add(sp);
    auraSprites.push(sp);
    return sp;
}

// Snapshot buildings before any glitching occurs
var initBuildings = buildings.slice();
initBuildings.forEach(function(b) {
    var c  = AURA_COLS[Math.floor(Math.random() * AURA_COLS.length)];
    var c2 = AURA_COLS[Math.floor(Math.random() * AURA_COLS.length)];
    makeAuraSprite(b.position.x, b.userData.bw * 0.5 + 3, b.position.z, b.userData.bw * 2.2 + 3, c);
    if (Math.random() < 0.45)
        makeAuraSprite(b.position.x + (Math.random()-0.5)*4, b.userData.bw * 0.5 + 7, b.position.z + (Math.random()-0.5)*4, b.userData.bw * 1.3, c2);
});

// Lantern auras (every other)
lanterns.forEach(function(l, li) {
    if (li % 2 !== 0) return;
    makeAuraSprite(l.userData.baseX, l.userData.y + 1, l.userData.baseZ,
                   2.5 + Math.random() * 3.5, AURA_COLS[Math.floor(Math.random() * AURA_COLS.length)]);
});

// Portal ring auras
spinners.forEach(function(sp2) {
    makeAuraSprite(sp2.position.x, sp2.position.y, sp2.position.z,
                   sp2.userData.radius * 3.2, AURA_COLS[Math.floor(Math.random() * AURA_COLS.length)]);
});

// Path symbol auras (every 5th)
pathPts.forEach(function(pt, pi2) {
    if (pi2 % 5 !== 0) return;
    makeAuraSprite(pt.x, 1.4, pt.z, 3.0, AURA_COLS[Math.floor(Math.random() * AURA_COLS.length)]);
});

// Rainbow building aura
makeAuraSprite(RAINBOW_POS.x, 12, RAINBOW_POS.z, 18, 0xffddff);
makeAuraSprite(RAINBOW_POS.x, 6, RAINBOW_POS.z, 10, 0xffaacc);

// Ambient world auras
for (var _rai = 0; _rai < 22; _rai++) {
    var _ra = Math.random() * Math.PI * 2, _rd = 15 + Math.random() * 85;
    makeAuraSprite(Math.cos(_ra)*_rd, 2 + Math.random()*10, Math.sin(_ra)*_rd,
                   5 + Math.random()*9, AURA_COLS[Math.floor(Math.random() * AURA_COLS.length)]);
}

// Player aura (stays behind player)
var playerAuraSp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffffff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
}));
playerAuraSp.scale.setScalar(9);
scene.add(playerAuraSp);

// ── Connection lines (visible in aura mode) ────────
var connectionLines = [];
var denseLines = [];

function makeConnLine(p1, p2, col, baseOp) {
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(
        [p1.x, p1.y, p1.z, p2.x, p2.y, p2.z], 3));
    var mat = new THREE.LineBasicMaterial({
        color: col, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    var ln = new THREE.Line(geo, mat);
    ln.userData.baseOp = baseOp || 0.11;
    scene.add(ln);
    connectionLines.push(ln);
    return ln;
}

// Building-to-building connections (nearby pairs)
for (var _cbi = 0; _cbi < initBuildings.length; _cbi++) {
    for (var _cbj = _cbi + 1; _cbj < initBuildings.length; _cbj++) {
        var _b1 = initBuildings[_cbi], _b2 = initBuildings[_cbj];
        var _bdx = _b1.position.x - _b2.position.x, _bdz = _b1.position.z - _b2.position.z;
        if (Math.sqrt(_bdx*_bdx + _bdz*_bdz) < 38 && Math.random() < 0.38) {
            makeConnLine(
                new THREE.Vector3(_b1.position.x, _b1.userData.bw*0.5+4, _b1.position.z),
                new THREE.Vector3(_b2.position.x, _b2.userData.bw*0.5+4, _b2.position.z),
                AURA_COLS[Math.floor(Math.random()*AURA_COLS.length)], 0.09);
        }
    }
}

// Lantern → nearest path symbol
lanterns.forEach(function(l, li) {
    if (li % 3 !== 0) return;
    var lp = new THREE.Vector3(l.userData.baseX, l.userData.y, l.userData.baseZ);
    var best = null, bestD = 999;
    pathPts.forEach(function(pt) { var d = lp.distanceTo(pt); if (d < bestD && d < 45) { bestD = d; best = pt; } });
    if (best) makeConnLine(lp, new THREE.Vector3(best.x, best.y, best.z), AURA_COLS[Math.floor(Math.random()*AURA_COLS.length)], 0.10);
});

// Portal ring ↔ portal ring
for (var _sli = 0; _sli < spinners.length - 1; _sli += 2) {
    if (spinners[_sli+1])
        makeConnLine(spinners[_sli].position, spinners[_sli+1].position, AURA_COLS[Math.floor(Math.random()*AURA_COLS.length)], 0.14);
}

// Path symbol chain
for (var _pci = 0; _pci < pathPts.length - 9; _pci += 9) {
    makeConnLine(
        new THREE.Vector3(pathPts[_pci].x, pathPts[_pci].y, pathPts[_pci].z),
        new THREE.Vector3(pathPts[_pci+9].x, pathPts[_pci+9].y, pathPts[_pci+9].z),
        AURA_COLS[Math.floor(Math.random()*AURA_COLS.length)], 0.12);
}

// Dense connections (only visible during degradation - everything links everything)
for (var _dci = 0; _dci < 48; _dci++) {
    var _di1 = Math.floor(Math.random() * auraSprites.length);
    var _di2 = Math.floor(Math.random() * auraSprites.length);
    if (_di1 === _di2) continue;
    var _dl = makeConnLine(auraSprites[_di1].position, auraSprites[_di2].position,
                           AURA_COLS[Math.floor(Math.random()*AURA_COLS.length)], 0.07);
    _dl.userData.isDense = true;
    denseLines.push(_dl);
}

// ── Aura sound on toggle ───────────────────────────
function playAuraSound() {
    try {
        var _ac = new (window.AudioContext || window.webkitAudioContext)();
        var _osc = _ac.createOscillator();
        var _gn  = _ac.createGain();
        _osc.connect(_gn); _gn.connect(_ac.destination);
        var _t = _ac.currentTime;
        _osc.type = 'sine';
        if (auraMode) {
            _osc.frequency.setValueAtTime(55, _t);
            _osc.frequency.exponentialRampToValueAtTime(220, _t + 0.18);
            _osc.frequency.exponentialRampToValueAtTime(42, _t + 0.65);
            _gn.gain.setValueAtTime(0, _t);
            _gn.gain.linearRampToValueAtTime(0.13, _t + 0.1);
            _gn.gain.linearRampToValueAtTime(0, _t + 0.9);
        } else {
            _osc.frequency.setValueAtTime(220, _t);
            _osc.frequency.exponentialRampToValueAtTime(55, _t + 0.5);
            _gn.gain.setValueAtTime(0, _t);
            _gn.gain.linearRampToValueAtTime(0.09, _t + 0.05);
            _gn.gain.linearRampToValueAtTime(0, _t + 0.55);
        }
        _osc.start(_t); _osc.stop(_t + 1.1);
        setTimeout(function() { try { _ac.close(); } catch(e) {} }, 1400);
    } catch(e) {}
}

// Toggle key: F
document.addEventListener('keydown', function(e) {
    if (e.code !== 'KeyF' || !locked || auraToggleCooldown > 0) return;
    auraMode = !auraMode;
    auraToggleCooldown = 0.5;
    playAuraSound();
    if (auraMode) {
        showAuraMsg('aura vision active');
    } else {
        clearTimeout(auraMsgTimeout);
        auraMsgEl2.style.opacity = '0';
    }
});

// ── Main aura update ───────────────────────────────
function updateAuraVision(dt) {
    if (auraToggleCooldown > 0) auraToggleCooldown -= dt;

    // Lerp intensity
    auraIntensity += ((auraMode ? 1 : 0) - auraIntensity) * Math.min(1, dt * 4.5);

    if (auraMode) {
        auraCumulativeTime += dt;
        auraDegradation = Math.min(1, auraCumulativeTime / 65);
        if      (auraCumulativeTime < 25) auraPhase = 'clear';
        else if (auraCumulativeTime < 55) auraPhase = 'saturating';
        else                              auraPhase = 'overloaded';

        // Sparse feedback messages
        auraFeedbackTimer -= dt;
        if (auraFeedbackTimer <= 0 && locked) {
            var _phrases = auraPhase === 'clear' ? auraFeedbackClear
                         : auraPhase === 'saturating' ? auraFeedbackSat : auraFeedbackOver;
            showAuraMsg(_phrases[Math.floor(Math.random() * _phrases.length)]);
            auraFeedbackTimer = Math.max(6, 14 - auraDegradation * 9);
        }
    }

    // Canvas softening: subtle blur + saturation surge
    var _blur = auraIntensity * (0.75 + auraDegradation * 0.9);
    var _sat  = 100 + auraIntensity * (85 + auraDegradation * 140);
    var _brt  = 100 + auraIntensity * (7  + auraDegradation * 16);
    auraCanvasEl.style.filter = auraIntensity > 0.02
        ? ('blur(' + _blur.toFixed(1) + 'px) saturate(' + _sat.toFixed(0) + '%) brightness(' + _brt.toFixed(0) + '%)')
        : 'none';

    // Update aura field sprites
    var _maxBaseOp = 0.36 + auraDegradation * 0.3;
    for (var _ai = 0; _ai < auraSprites.length; _ai++) {
        var _asp = auraSprites[_ai];
        var _pulse = 0.55 + 0.45 * Math.sin(elapsed * _asp.userData.spd + _asp.userData.ph);
        var _tOp = auraIntensity * _pulse * _maxBaseOp;
        _asp.material.opacity += (_tOp - _asp.material.opacity) * Math.min(1, dt * 2.8);
        _asp.scale.setScalar(_asp.userData.r * 2.2 * (1 + auraDegradation * 0.35) * (0.94 + 0.06 * _pulse));
    }

    // Player aura (hovers just behind camera)
    var _pfx = Math.sin(yaw), _pfz = -Math.cos(yaw);
    playerAuraSp.position.set(camPos.x - _pfx * 0.8, camPos.y - 0.3, camPos.z - _pfz * 0.8);
    playerAuraSp.material.opacity = auraIntensity * 0.3;

    // Connection lines: base visible, dense lines unlock with degradation
    for (var _cli = 0; _cli < connectionLines.length; _cli++) {
        var _cl = connectionLines[_cli];
        var _isDense = _cl.userData.isDense;
        var _tOp2 = _isDense
            ? auraIntensity * Math.max(0, auraDegradation - 0.28) * _cl.userData.baseOp * 2.2
            : auraIntensity * _cl.userData.baseOp * (1 + auraDegradation * 0.7);
        _cl.material.opacity += (_tOp2 - _cl.material.opacity) * Math.min(1, dt * 2.2);
    }

    // Indicator text
    if (auraIntensity > 0.5) {
        var _iCol = auraPhase === 'overloaded' ? 'rgba(255,140,140,0.9)' : 'rgba(175,255,215,0.9)';
        var _iTxt = auraPhase === 'overloaded' ? '◉ AURA [SATURATED]' : '◉ AURA VISION';
        auraIndicatorEl.textContent = _iTxt;
        auraIndicatorEl.style.color = _iCol;
        auraIndicatorEl.style.opacity = (0.6 + 0.4 * Math.sin(elapsed * 2.2)).toFixed(2);
    } else {
        auraIndicatorEl.style.opacity = (auraIntensity * 1.8).toFixed(2);
    }

    // Overload: violent pulsing of all aura sprites + occasional screen flash
    if (auraPhase === 'overloaded' && auraIntensity > 0.8) {
        if (Math.random() < 0.006) {
            portalFlashEl.style.transition = 'opacity 0.04s';
            portalFlashEl.style.opacity = (0.04 + Math.random() * 0.08).toFixed(2);
            setTimeout(function() { portalFlashEl.style.transition = 'opacity 0.4s'; portalFlashEl.style.opacity = '0'; }, 55);
        }
    }
}

// ── SYSTEM 8: MICRO DISTORTIONS ───────────────────
function updateMicroDistortions(dt) {
    rollCurrent += (rollTarget - rollCurrent) * Math.min(1, dt * 2.0);
    if (Math.random() < 0.004 && locked) {
        jitterX2 = (Math.random() - 0.5) * 0.042;
        jitterY2 = (Math.random() - 0.5) * 0.042;
        jitterActive = 0.12;
    }
    if (jitterActive > 0) {
        jitterActive -= dt;
        camera.position.x += jitterX2;
        camera.position.y += jitterY2;
    }
    var hOff = Math.sin(elapsed * 0.17) * 4.2 + Math.sin(elapsed * 0.73) * 1.6;
    hudEl.style.transform = 'translateX(calc(-50% + ' + hOff.toFixed(1) + 'px))';
}

// ── MAIN LOOP ──────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    // player movement
    moveEuler.set(pitch, yaw, rollCurrent, 'YXZ');
    camera.quaternion.setFromEuler(moveEuler);
    fwd.set(0, 0, -1).applyEuler(moveEuler); fwd.y = 0; fwd.normalize();
    right.set(1, 0, 0).applyEuler(moveEuler); right.y = 0; right.normalize();
    var spd = 8.5 * dt;
    if (keys['KeyW'] || keys['ArrowUp'])    camPos.addScaledVector(fwd,    spd);
    if (keys['KeyS'] || keys['ArrowDown'])  camPos.addScaledVector(fwd,   -spd);
    if (keys['KeyA'] || keys['ArrowLeft'])  camPos.addScaledVector(right, -spd);
    if (keys['KeyD'] || keys['ArrowRight']) camPos.addScaledVector(right,  spd);

    // jump
    if (keys['Space'] && onGround) {
        velY = 10;
        onGround = false;
        onJump();
    }
    // gravity
    if (!onGround) {
        velY -= 22 * dt;
        camPos.y += velY * dt;
        if (camPos.y <= 1.7) {
            camPos.y = 1.7;
            velY = 0;
            onGround = true;
        }
    }

    checkPortals(dt);
    camera.position.copy(camPos);

    // true path — warm organic pulse
    for (var i = 0; i < pathSprites.length; i++) {
        var s = pathSprites[i];
        var pulse = 0.65 + 0.35 * Math.sin(elapsed * 2.2 + i * 0.28);
        s.material.opacity = pulse;
        s.position.y = s.userData.baseY + Math.sin(elapsed * 1.4 + i * 0.38) * 0.22;
        s.scale.setScalar(1.5 + 0.28 * Math.sin(elapsed * 2.8 + i * 0.5));
    }

    // decoys — different rhythm; some briefly boosted by false reinforcement
    for (var j = 0; j < decoySprites.length; j++) {
        var ds = decoySprites[j];
        ds.position.y = ds.userData.baseY + Math.sin(elapsed * 0.75 + ds.userData.phase) * 0.14;
        if (ds.userData.boosted) {
            ds.userData.boostTimer -= dt;
            ds.material.opacity = 0.85 + 0.12 * Math.sin(elapsed * 4);
            if (ds.userData.boostTimer <= 0) ds.userData.boosted = false;
        } else {
            ds.material.opacity = 0.3 + 0.22 * Math.sin(elapsed * 1.15 + ds.userData.phase);
        }
    }

    // lanterns float upward
    for (var k = 0; k < lanterns.length; k++) {
        var l = lanterns[k];
        l.userData.y += l.userData.speed * 0.018;
        if (l.userData.y > 34) {
            l.userData.y = 1.5 + Math.random() * 2;
            l.position.x = l.userData.baseX + (Math.random() - 0.5) * 6;
            l.position.z = l.userData.baseZ + (Math.random() - 0.5) * 6;
        }
        l.position.y = l.userData.y + Math.sin(elapsed * 0.5 + l.userData.phase) * 0.45;
        l.material.opacity = 0.22 + 0.32 * Math.sin(elapsed * l.userData.speed * 2 + l.userData.phase);
    }

    // signs bob
    for (var m = 0; m < floatSigns.length; m++) {
        var fs = floatSigns[m];
        fs.position.y = fs.userData.baseY + Math.sin(elapsed * fs.userData.speed + fs.userData.phase) * 0.55;
        fs.material.opacity = 0.45 + 0.28 * Math.sin(elapsed * 0.4 + fs.userData.phase);
    }

    // spinning rings
    for (var n = 0; n < spinners.length; n++) {
        spinners[n].rotation.x += spinners[n].userData.rs.x * dt;
        spinners[n].rotation.y += spinners[n].userData.rs.y * dt;
        spinners[n].rotation.z += spinners[n].userData.rs.z * dt;
    }

    updateFedora(dt);
    updateRainbowFlicker(dt);
    checkBuildingCollisions();
    updateGlitching(dt);
    updatePetals();

    // ── Psychological systems ──────────────────────
    // Camera spin detection (system 4)
    var yawDPS = Math.abs(yaw - psYaw);
    psYaw = yaw;
    if (yawDPS > 0.05 && locked) {
        yawSpinAcc = Math.min(yawSpinAcc + yawDPS, 2.5);
    } else {
        yawSpinAcc = Math.max(0, yawSpinAcc - dt * 1.5);
    }
    if (yawSpinAcc > 1.8 && colorShiftTimer <= 0 && Math.random() < 0.45) {
        colorShiftTimer = 2.2;
        yawSpinAcc = 0;
    }

    // Still-timer for fog dim (system 4)
    var movingNow = keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'] ||
                    keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight'];
    if (movingNow) { stillTimer = 0; }
    else {
        stillTimer += dt;
        if (stillTimer > 2.2 && dimTimer <= 0 && locked && Math.random() < 0.003) {
            dimTimer = 3.5;
        }
    }

    // System 1: false sign reinforcement timer
    falseSignTimer -= dt;
    if (falseSignTimer <= 0 && locked && movingNow) {
        if (Math.random() < 0.4) triggerFalseReinforcement();
        falseSignTimer = 12 + Math.random() * 18;
    }

    // Auth / narration message timers (systems 3 + 5)
    if (authTimer > 0) { authTimer -= dt; if (authTimer <= 0) authEl.style.opacity = '0'; }
    if (narrTimer > 0) { narrTimer -= dt; if (narrTimer <= 0) narrEl.style.opacity = '0'; }
    narrCountdown -= dt;
    if (narrCountdown <= 0 && locked) {
        showNarr(narrPhrases[Math.floor(Math.random() * narrPhrases.length)]);
        narrCountdown = 28 + Math.random() * 22;
    }

    updateWatchers(dt);
    updateElectricity(dt);
    updateFalseConnections(dt);
    checkStaircaseTrigger();
    updateStaircase(dt);
    checkSymbolProximity();
    updateFootmarks(dt);
    updateMicroDistortions(dt);
    updateAuraVision(dt);

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
